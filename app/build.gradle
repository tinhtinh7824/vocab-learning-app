plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.eapp'
    compileSdk 35  // Sử dụng SDK mới nhất ổn định

    defaultConfig {
        applicationId "com.example.eapp"
        minSdk 24
        targetSdk 35  // Cập nhật SDK target
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'  // Đảm bảo rằng tệp manifest tồn tại
        }
    }
}

dependencies {
    // Room Database
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"  // Dùng annotationProcessor cho Java

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'  // Sử dụng annotationProcessor cho Glide

    // RecyclerView for lists
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    // Lifecycle libraries
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Appcompat and Material Design
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.5.0'

    // Compose libraries
    implementation 'androidx.compose.material3:material3:1.0.0'

    // Activity and ConstraintLayout
    implementation 'androidx.activity:activity:1.2.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'

    // Testing dependencies
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
